# Production-mode frontend: pages are compiled once at build time, so every page answers in well under a
# second. The default docker-compose.yml runs `next dev`, which compiles each page on its first visit
# (the Forms page took ~30 s that way).
#
#   PUBLIC_API_BASE_URL=http://<server-address>:8000/api/v1 \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build frontend
#
# PUBLIC_API_BASE_URL is baked into the build and must be the address the BROWSER uses to reach the API.
services:
  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    command: ["node", "server.js"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes: !reset []
