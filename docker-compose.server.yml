# Server deployment. Postgres, Redis and MinIO are NOT managed here: they are your existing instances.
# All backend/worker config (DB, Redis, MinIO, API keys, SMTP, STEREO_AGENT_CHANNEL...) comes from .env,
# next to this file.
#
# Every service uses the host network: containers share the server's network stack, so localhost in .env
# reaches services running on this machine. No ports: mappings. The backend listens on host :8010 and the
# frontend on host :3000.
#
#   docker compose -f docker-compose.server.yml up -d --build
#
# REQUIRED in .env before the first start: FORMS_JWT_SECRET (32+ random characters; the API refuses to start
# with the public default) and INTERNAL_API_KEY (also set as the MinIO webhook auth_token).
#
# Set NEXT_PUBLIC_API_BASE_URL (in the shell or a .env used by compose) to the address the BROWSER uses to
# reach the API. It is built into the frontend, so changing it needs `up -d --build frontend`.

x-backend-common: &backend-common
  build: ./backend
  # Run as root inside the container. ./backend is bind-mounted over /app and owned by root on the host, so
  # the image's default appuser (uid 1000) can't create /app/public/uploads etc. Running as root makes this
  # work regardless of who owns the project folder, with no chown after a fresh clone.
  user: "0:0"
  env_file:
    - .env
  network_mode: host
  volumes:
    - ./backend:/app
  restart: unless-stopped

services:
  backend:
    <<: *backend-common
    # The image's own CMD is the production command with no --reload; restore hot-reload for this setup.
    # Port 8010: host :8000 (jarvis-agent-manager) and :8001 are already taken.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload

  worker:
    <<: *backend-common
    # Consumes only the heavy pipeline queues (gpu-heavy/cpu-io), so a priority-reprocess task never waits
    # behind a slow LLM/STT stage.
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q gpu-heavy,cpu-io
    depends_on:
      - backend

  # Dedicated process for priority-reprocess, isolated from slow LLM tasks.
  # Also owns -B (Celery Beat). Beat is what sends the scheduled PDF/CSV reports (run-due-reports, every
  # 60 s) and enqueues sync_call_records, so keep exactly ONE process running with -B.
  worker-priority:
    <<: *backend-common
    command: celery -A app.tasks.celery_app worker --loglevel=info -B -Q priority-reprocess --concurrency=2
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      # Production build (the `runner` stage): every page is compiled once at build time, so pages answer in
      # under a second. The old `next dev` setup compiled each page on first visit (Forms took ~30 s).
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://192.168.9.119:8010/api/v1}
    network_mode: host
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://192.168.9.119:8010/api/v1}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
